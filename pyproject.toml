[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x-cli"
version = "2.0.0"
description = "X/Twitter command-line toolkit — read, search, post, engage. Cookie-based auth, JSON output, scriptable and LLM-friendly."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "nemoaigc" }]
keywords = ["twitter", "x", "cli", "scraping", "articles", "post"]
dependencies = [
    "typer>=0.12",
    "curl_cffi>=0.7",
    "xclienttransaction>=1.0.1",
    "browser-cookie3>=0.19",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
x-cli = "x_cli.__main__:app"

[project.urls]
Homepage = "https://github.com/nemoaigc/x-cli"
Repository = "https://github.com/nemoaigc/x-cli"
"Upstream (twitter-cli)" = "https://github.com/public-clis/twitter-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/x_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
